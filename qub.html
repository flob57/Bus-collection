<body>
<header class="hero"><div class="top"><button class="back" onclick="location.href='/'">← Bus Collection</button><div class="brand"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/QUB-Logo.svg" alt="QUB"><span>QUB</span></div><button class="sync" id="sync">↻ Synchroniser</button></div><div class="eyebrow">QUIMPER · FINISTÈRE</div><h1>Le patrimoine roulant de Quimper.</h1><p>Le parc QUB est maintenant connecté à la même API Notion que les autres réseaux de Bus Collection.</p><div class="stats"><div class="stat"><strong id="count">—</strong><span>véhicules</span></div><div class="stat"><strong id="active">—</strong><span>en service</span></div><div class="stat"><strong>QUB</strong><span>réseau</span></div></div></header>
<section class="tools"><input class="search" id="search" placeholder="Immatriculation, parc, marque, modèle…"></section><main id="app" class="loading">Chargement du parc QUB…</main>
<script>
let vehicles=[];const app=document.getElementById('app'),count=document.getElementById('count'),active=document.getElementById('active'),search=document.getElementById('search'),sync=document.getElementById('sync');
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();const list=vehicles.filter(v=>`${v.park} ${v.registration} ${v.brand} ${v.model} ${v.type} ${v.operator} ${v.depot}`.toLowerCase().includes(q));app.className='grid';app.innerHTML=list.map(v=>`<article class="card"><div class="photo">${v.image?`<img src="${esc(v.image)}" alt="" style="width:100%;height:100%;object-fit:cover">`:'🚌'}</div><div class="body"><div class="park">PARC ${esc(v.park)}</div><div class="model">${esc(v.brand)} ${esc(v.model)}</div><div class="meta"><b>${esc(v.registration)}</b><br>Type : ${esc(v.type)}<br>Mise en circulation : ${esc(v.circulationDate||v.date||'—')}<br>Arrivée réseau : ${esc(v.arrivalDate||'—')}<br>${esc(v.status||'')}</div><div class="links">${v.notionUrl?`<a href="${esc(v.notionUrl)}" target="_blank" rel="noreferrer">↗ Ouvrir dans Notion</a>`:''}</div></div></article>`).join('')||'<div class="empty">Aucun véhicule trouvé.</div>';}
async function load(){sync.disabled=true;sync.textContent='↻ Synchronisation…';app.className='loading';app.textContent='Chargement du parc QUB…';try{let cursor='';let all=[];let safety=0;do{const p=new URLSearchParams({network:'qub',t:String(Date.now())});if(cursor)p.set('cursor',cursor);const r=await fetch('/api/vehicles?'+p.toString(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.details||d.error||'Erreur');all.push(...(d.vehicles||[]));cursor=d.has_more&&d.next_cursor?d.next_cursor:'';if(++safety>20)throw new Error('Trop de pages Notion.')}while(cursor);vehicles=all;count.textContent=vehicles.length;active.textContent=vehicles.filter(v=>!/réform|retir|hors/i.test(v.status||'')).length;render()}catch(e){app.className='empty';app.innerHTML='<h2>Impossible de synchroniser</h2><p>'+esc(e.message)+'</p>'}finally{sync.disabled=false;sync.textContent='↻ Synchroniser'}}search.addEventListener('input',render);sync.addEventListener('click',load);load();
</script>
</body></html>
