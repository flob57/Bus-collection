<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>QUB · Bus Collection</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#101010}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(135deg,#151515,#303030);padding:22px clamp(18px,5vw,70px) 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back,.sync{border:1px solid #ffffff33;border-radius:999px;padding:10px 15px;background:#ffffff12;color:#fff;font-weight:700;cursor:pointer}.brand{font-weight:900;letter-spacing:.08em;font-size:22px;color:#d7df00}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#d7df00;margin-top:35px}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.95;margin:8px 0}.hero p{max-width:720px;color:#bdbdbd}.stats{display:flex;gap:28px;margin-top:28px}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;text-transform:uppercase;color:#888}.tools{position:sticky;top:0;background:#101010dd;backdrop-filter:blur(12px);padding:14px clamp(18px,5vw,70px);z-index:2}.search{width:100%;padding:13px 16px;border:1px solid #444;border-radius:14px;background:#202020;color:#fff;font-size:16px}.grid{padding:24px clamp(18px,5vw,70px) 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{background:#191919;border:1px solid #333;border-radius:18px;overflow:hidden}.photo{height:125px;background:#242424;display:grid;place-items:center;color:#777;font-size:42px}.body{padding:16px}.park{font-size:13px;color:#d7df00;font-weight:900}.model{font-size:18px;font-weight:800;margin:7px 0}.meta{font-size:13px;line-height:1.55;color:#aaa}.links{margin-top:12px}.links a{color:#d7df00;text-decoration:none;font-weight:700;font-size:13px}.empty,.loading{text-align:center;padding:60px;color:#aaa}.loading{font-weight:700}@media(max-width:600px){.stats{gap:18px}.grid{grid-template-columns:1fr}.tools{position:static}}
</style>
</head>
<body>
<header class="hero"><div class="top"><button class="back" onclick="location.href='/'">← Bus Collection</button><div class="brand">QUB</div><button class="sync" id="sync">↻ Synchroniser</button></div><div class="eyebrow">QUIMPER · FINISTÈRE</div><h1>Le patrimoine roulant de Quimper.</h1><p>Le parc QUB est maintenant connecté à la même API Notion que les autres réseaux de Bus Collection.</p><div class="stats"><div class="stat"><strong id="count">—</strong><span>véhicules</span></div><div class="stat"><strong id="active">—</strong><span>en service</span></div><div class="stat"><strong>QUB</strong><span>réseau</span></div></div></header>
<section class="tools"><input class="search" id="search" placeholder="Immatriculation, parc, marque, modèle…"></section><main id="app" class="loading">Chargement du parc QUB…</main>
<script>
let vehicles=[];const app=document.getElementById('app'),count=document.getElementById('count'),active=document.getElementById('active'),search=document.getElementById('search'),sync=document.getElementById('sync');
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();const list=vehicles.filter(v=>`${v.park} ${v.registration} ${v.brand} ${v.model} ${v.type} ${v.operator} ${v.depot}`.toLowerCase().includes(q));app.className='grid';app.innerHTML=list.map(v=>`<article class="card"><div class="photo">${v.image?`<img src="${esc(v.image)}" alt="" style="width:100%;height:100%;object-fit:cover">`:'🚌'}</div><div class="body"><div class="park">PARC ${esc(v.park)}</div><div class="model">${esc(v.brand)} ${esc(v.model)}</div><div class="meta"><b>${esc(v.registration)}</b><br>Type : ${esc(v.type)}<br>Mise en circulation : ${esc(v.circulationDate||v.date||'—')}<br>Arrivée réseau : ${esc(v.arrivalDate||'—')}<br>${esc(v.status||'')}</div><div class="links">${v.notionUrl?`<a href="${esc(v.notionUrl)}" target="_blank" rel="noreferrer">↗ Ouvrir dans Notion</a>`:''}</div></div></article>`).join('')||'<div class="empty">Aucun véhicule trouvé.</div>';}
async function load(){sync.disabled=true;sync.textContent='↻ Synchronisation…';app.className='loading';app.textContent='Chargement du parc QUB…';try{let cursor='';let all=[];let safety=0;do{const p=new URLSearchParams({network:'qub',t:String(Date.now())});if(cursor)p.set('cursor',cursor);const r=await fetch('/api/vehicles?'+p.toString(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.details||d.error||'Erreur');all.push(...(d.vehicles||[]));cursor=d.has_more&&d.next_cursor?d.next_cursor:'';if(++safety>20)throw new Error('Trop de pages Notion.')}while(cursor);vehicles=all;count.textContent=vehicles.length;active.textContent=vehicles.filter(v=>!/réform|retir|hors/i.test(v.status||'')).length;render()}catch(e){app.className='empty';app.innerHTML='<h2>Impossible de synchroniser</h2><p>'+esc(e.message)+'</p>'}finally{sync.disabled=false;sync.textContent='↻ Synchroniser'}}search.addEventListener('input',render);sync.addEventListener('click',load);load();
</script>
</body></html>
